name: Check price alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call check-alerts endpoint
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/check-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
